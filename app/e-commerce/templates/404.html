{% extends "base.html" %}
{% block title %}صفحه مورد نظر یافت نشد (۴۰۴) | بنده{% endblock %}

{% block content %}
<!-- 404 Not Found Page (Bandeh Shop - Stage 1 Design System)
     Mobile-first, dark theme default, light theme supported,
     amber gold as the one accent color for prices and main buttons. -->

<div class="theme-bg-card theme-border border rounded-3xl p-8 sm:p-10 text-center my-6 max-w-md mx-auto shadow-sm">
  <div class="mb-4">
    <span class="theme-accent font-black text-6xl sm:text-7xl tracking-tighter">۴۰۴</span>
  </div>
  
  <h1 class="text-xl sm:text-2xl font-black theme-text-main mb-2">
    صفحه مورد نظر یافت نشد
  </h1>
  
  <p class="text-xs sm:text-sm theme-text-muted mb-8 leading-relaxed">
    آدرس وارد شده ممکن است تغییر کرده یا حذف شده باشد. لطفاً آدرس را بررسی کنید یا به صفحه اصلی بازگردید.
  </p>
  
  <div class="flex flex-col gap-3">
    <a href="/"
       class="w-full theme-btn-accent font-bold py-3 px-6 rounded-xl text-sm flex items-center justify-center min-h-[48px]">
      بازگشت به صفحه اصلی
    </a>
    <a href="/search"
       class="w-full theme-btn-secondary font-semibold py-3 px-6 rounded-xl text-sm flex items-center justify-center min-h-[48px]">
      جستجوی کالاها
    </a>
  </div>
</div>
{% endblock %}
