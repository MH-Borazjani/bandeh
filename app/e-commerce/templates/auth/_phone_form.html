<!-- Phone-number form. Also re-rendered by the server with an `error`
     when the number is invalid or the user must wait before retrying. -->
<form hx-post="/auth/otp/request" hx-target="#auth-box" hx-swap="innerHTML" class="space-y-4">
  {% if error %}
  <p class="bg-red-950 border border-red-800 text-red-300 rounded-lg px-4 py-3 text-sm">{{ error }}</p>
  {% endif %}
  <div>
    <label for="phone" class="block mb-2 text-sm text-neutral-300">شماره موبایل</label>
    <input id="phone" name="phone" type="tel" inputmode="tel" dir="ltr" required
           placeholder="09123456789" value="{{ phone | default('') }}"
           class="w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-3 text-left placeholder-neutral-500 focus:outline-none focus:border-teal-500">
  </div>
  <button type="submit"
          class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold rounded-lg py-3">
    ارسال کد تایید
  </button>
</form>
