services:
  # ---------------------------------------------------------------------------
  # Web Service: FastAPI Application
  # ---------------------------------------------------------------------------
  web:
    # Build container image using the Dockerfile in the project root
    build: .
    ports:
      # Expose container port 80 to host machine port 8000
      - "8000:80"
    env_file:
      # Inject local application configuration and secrets from .env
      - .env
    volumes:
      # Bind-mount current directory for live code reload during development
      - .:/app
      # Anonymous volume preventing the host's virtual environment from
      # overwriting the container's isolated Linux-built virtual environment
      - /app/.venv
    # Execute the FastAPI dev server using uv package runner, bound to all network interfaces
    command:
      [
        "uv",
        "run",
        "fastapi",
        "dev",
        "app/e-commerce/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "80",
      ]

  # ---------------------------------------------------------------------------
  # Database Service: PostgreSQL
  # ---------------------------------------------------------------------------
  database:
    image: postgres:16-alpine
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      # تست سلامت با استفاده از متغیرهای محیطی واقعی
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Cache Service: Redis
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7
    healthcheck:
      # Validate Redis connectivity via the CLI ping command
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

 # ---------------------------------------------------------------------------
  # Headless CMS Service: Directus
  # ---------------------------------------------------------------------------
  directus:
    image: directus/directus:12.0.2
    ports:
      - "8055:8055"
    volumes:
      - ./volumes/uploads:/directus/uploads
      - ./volumes/extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8055/server/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    environment:
      SECRET: ${SECRET_KEY}

      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      # اتصال به دیتابیس با همان متغیرهای یکسان سرویس database
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      PUBLIC_URL: "http://localhost:8055"