services:
  web:
    build: .
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    command:
      [
        "uv",
        "run",
        "fastapi",
        "dev",
        "app/main.py",
        "--host",
        "0.0.0.0",
        "--port",
        "80",
      ]

