[project]
name = "easy-auto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    # itsdangerous is no longer inside fastapi[standard] (it was dropped
    # from the extra in recent versions): the signed session cookie in
    # app/e-commerce/auth.py needs it directly.
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "zernio-sdk>=1.4.475",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "psycopg>=3.3.6",
    "httpx>=0.28.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.ty.environment]
extra-paths = ["app/e-commerce"]

[tool.ty.src]
include = ["app/e-commerce", "tests", "env_settings.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["app/e-commerce/**/*.py", "tests/**/*.py", "env_settings.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FAST", "ANN"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "core",
    "db",
    "env_settings",
    "integrations",
    "main",
    "schema",
    "services",
]

[tool.ruff.lint.per-file-ignores]
"app/e-commerce/schema/check_models.py" = ["E402"]
"tests/check_*.py" = ["E402", "E501", "ANN"]
"tests/test_hardening.py" = ["E402"]
